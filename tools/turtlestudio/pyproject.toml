[project]
name = "turtlestudio"
version = "0.2.0"
description = "Herramientas Python para cartuchos .turtlecart (FantasyConsole) — editor PyQt6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
]

[project.optional-dependencies]
# lupa (Lua para Play mode) NO se instala con pip normal: el wheel de PyPI trae
# Lua 5.5, hay que compilarlo contra firmware/libraries/lua54 (5.4.6) a mano.
# Ver README.md, seccion "Play", para el comando exacto.
play = ["lupa"]

[project.scripts]
turtlestudio = "turtlestudio.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turtlestudio = ["strings.csv"]
