[project]
name = "turtlestudio"
version = "0.1.0"
description = "Herramientas Python para cartuchos .turtlecart (FantasyConsole)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dearpygui>=1.10.0",
]

[project.scripts]
turtlestudio = "turtlestudio.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
